<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="車内LCD">
<meta name="theme-color" content="#000000">
<title>東亜鉄道・中谷交通 車内LCD</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
:root{--bg:#fff;--fg:#1a1a1a;--sub:#5f5f5a;--card:#f3f3f1;--line:rgba(0,0,0,.12);--btn:#fff;--acc:#2b6fd6;--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom);--sl:env(safe-area-inset-left);--sr:env(safe-area-inset-right)}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--fg:#eee;--sub:#aaa;--card:#1e1e1e;--line:rgba(255,255,255,.15);--btn:#2a2a2a;--acc:#6aa0ff}}
html{-webkit-text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;touch-action:manipulation;padding:var(--st) var(--sr) var(--sb) var(--sl)}
.app{max-width:960px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.frame{background:#2a2c30;border-radius:12px;padding:8px}
@media (min-width:600px){.frame{padding:12px}}
.pnl{background:var(--card);border-radius:12px;padding:12px}
.ttl{font-size:12px;color:var(--sub);margin:0 0 8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row+.row{margin-top:8px}
button,select{font:inherit;font-size:16px;min-height:44px;padding:0 12px;border:0.5px solid var(--line);border-radius:10px;background:var(--btn);color:var(--fg);cursor:pointer}
button{flex:1 1 auto}
button:active{transform:scale(.98)}
select{width:100%}
.lbl{font-size:13px;color:var(--sub);flex:1 1 100%}
.s{display:none}
#stat{font-size:13px;color:var(--sub)}
#dst{font-size:15px;font-weight:500}
.ann{font-size:15px;line-height:1.7}
.ann>div+div{margin-top:4px}
textarea{width:100%;height:260px;margin-top:8px;font-family:ui-monospace,Menlo,monospace;font-size:16px;background:var(--btn);color:var(--fg);border:0.5px solid var(--line);border-radius:10px;padding:8px}
.scr{container-type:inline-size;aspect-ratio:16/9;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;font-family:"Hiragino Sans","Noto Sans JP",sans-serif;color:#111;-webkit-user-select:none;user-select:none}
.col{width:11cqw;flex-shrink:0}
.vt{writing-mode:vertical-rl;font-weight:500;line-height:1.05;letter-spacing:.1cqw}
.chv{position:absolute;top:0;width:1.8cqw;height:5cqw;background:#c8102e;clip-path:polygon(0 0,45% 0,100% 50%,45% 100%,0 100%,55% 50%)}
.arw{width:13cqw;height:9cqw;background:#1f3fd1;clip-path:polygon(0 30%,55% 30%,55% 0,100% 50%,55% 100%,55% 70%,0 70%);flex-shrink:0}
.dl{animation:dl 4s forwards}.dr{animation:dr 4s forwards}
@keyframes dl{0%,20%{transform:translateX(0)}60%,100%{transform:translateX(-94%)}}
@keyframes dr{0%,20%{transform:translateX(0)}60%,100%{transform:translateX(94%)}}
@keyframes tk{from{transform:translateX(100cqw)}to{transform:translateX(-100%)}}
@keyframes pl{50%{opacity:.25}}
@media (orientation:landscape) and (max-height:500px){
.app{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) minmax(170px,240px);grid-template-rows:auto minmax(0,1fr);gap:8px;padding:8px;height:calc(100dvh - var(--st) - var(--sb))}
.pl{grid-column:1/3;grid-row:1;display:flex;flex-wrap:nowrap;align-items:center;gap:6px;overflow-x:auto;overflow-y:hidden;padding:6px 8px;border-radius:10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.pl::-webkit-scrollbar{display:none}
.pl .row{display:contents}
.pl .ttl,.pl .t{display:none}
.pl .s{display:inline}
.pl .lbl{flex:0 0 auto;font-size:12px;margin-left:4px}
.pl select{flex:0 0 150px;width:150px;min-height:36px;padding:0 8px}
.pl #dst{display:none}
.pl #stat{flex:0 0 auto;white-space:nowrap;font-size:12px}
.pl button{flex:0 0 auto;font-size:14px;min-height:36px;min-width:40px;padding:0 9px;white-space:nowrap}
.frame{grid-column:1;grid-row:2;align-self:center;justify-self:center;width:100%;max-width:calc((100dvh - var(--st) - var(--sb) - 84px)*16/9 + 12px);padding:6px}
.pr{grid-column:2;grid-row:2;overflow:auto;-webkit-overflow-scrolling:touch;padding:10px}
.ann{font-size:13px;line-height:1.6}
textarea{height:140px}
}
body.only{background:#000}
body.only .pl,body.only .pr{display:none}
body.only .app{display:flex;max-width:none;padding:0;height:auto;min-height:calc(100dvh - var(--st) - var(--sb));align-items:center;justify-content:center}
body.only .frame{border-radius:0;padding:0;max-width:none;width:min(calc(100vw - var(--sl) - var(--sr)),calc((100dvh - var(--st) - var(--sb))*16/9))}
</style>
</head>
<body>
<main class="app">
<div class="frame" id="frame">
<div class="scr">
<div id="hd" style="height:6.5cqw;display:flex;align-items:center;gap:1.6cqw;padding:0 1.5cqw;flex-shrink:0;background:#f4f5f6"></div>

<div id="mp" style="position:absolute;left:0;right:0;top:6.5cqw;bottom:4cqw;background:#fff;display:none"></div>
</div>
</div>
<section class="pnl pl">
<p class="ttl">運行設定</p>
<div class="row"><select id="sv" aria-label="系統と行き先"></select></div>
<div class="row"><span id="dst"></span></div>
<div class="row"><span id="stat"></span></div>
<div class="row">
<button id="bk" aria-label="戻る"><i class="ti ti-player-track-prev"></i><span class="t"> 戻る</span></button>
<button id="fw" aria-label="進む"><span class="t">進む </span><i class="ti ti-player-track-next"></i></button>
</div>
<div class="row"><button id="au" aria-label="自動"><i class="ti ti-player-play"></i><span class="t"> 自動</span></button></div>
<div class="row">
<button id="mpb" aria-label="路線図"><i class="ti ti-map"></i><span class="t"> 路線図</span></button>
<button id="only" aria-label="LCDのみ表示"><i class="ti ti-device-tv"></i><span class="t"> LCDのみ</span></button>
</div>
<div class="row"><button id="em" aria-label="急停車" aria-pressed="false" style="display:flex;align-items:center;justify-content:center;gap:8px"><svg viewBox="0 0 100 100" width="30" height="30" style="flex-shrink:0"><rect width="100" height="100" rx="14" fill="#e63a12"/><text x="50" y="34" font-size="30" font-weight="800" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif">STOP</text><rect x="12" y="44" width="30" height="34" rx="6" fill="#fff"/><rect x="17" y="50" width="20" height="12" rx="2" fill="#e63a12"/><circle cx="19" cy="70" r="2.6" fill="#e63a12"/><circle cx="35" cy="70" r="2.6" fill="#e63a12"/><path d="M18 78l-6 12M36 78l6 12" stroke="#fff" stroke-width="4" stroke-linecap="round"/><circle cx="68" cy="50" r="9" fill="none" stroke="#fff" stroke-width="3.5"/><rect x="64" y="46" width="8" height="30" rx="4" fill="#fff"/><path d="M56 68q2-4 8-2v-2h20q6 0 6 8v6q0 14-14 14h-6q-8 0-12-10z" fill="#fff"/></svg><span class="t">急停車</span></button></div>
<div class="row"><span class="lbl"><span class="t">表示器の位置</span><span class="s">表示器</span></span></div>
<div class="row"><button id="sdL" aria-label="進行方向左側のドア上"><span class="t">左側ドア上</span><span class="s">左</span></button><button id="sdR" aria-label="進行方向右側のドア上"><span class="t">右側ドア上</span><span class="s">右</span></button></div>
</section>
<section class="pnl pr">
<p class="ttl">放送</p>
<div class="ann">
<div id="annH" style="font-size:12px;color:var(--sub)"></div>
<div id="annJ"></div>
<div id="annE" style="color:var(--sub)"></div>
<div id="annM"></div>
</div>
<div class="row" style="margin-top:10px"><button id="ex"><i class="ti ti-file-text"></i> 全放送をテキスト表示</button><button id="cp" style="display:none"><i class="ti ti-copy"></i> コピー</button></div>
<textarea id="ta" readonly style="display:none"></textarea>
</section>
</main>
<script>
const NT=[['奈留都','なると','Naruto','L'],['立教','りっきょう','Rikkyo','L'],['山里','さんり','Sanri','L'],['青木ヶ原','あおきがはら','Aokigahara','L'],['上沢','かみざわ','Kamizawa','R'],['大和','やまと','Yamato','L'],['本只見','ほんただみ','Hontadami','L'],['尾野','おの','Ono','L'],['青海','あおみ','Aomi','R'],['上之','かみの','Kamino','R'],['蒼井','あおい','Aoi','L'],['東浅井','ひがしあさい','Higashi-Asai','L'],['上越','かみえつ','Kamietsu','L'],['浅井','あさい','Asai','L']];
const NS=[['河口','かわぐち','Kawaguchi','L'],['荒川河口','あらかわかこう','Arakawa-Estuary','L'],['松ケ谷中央','まつがやちゅうおう','Matugaya-Chuo','R'],['相模湾','さがみわん','Sagami-bay','L'],['大納','おのう','Onou','L'],['上沢','かみざわ','Kamizawa','R'],['青木ヶ原','あおきがはら','Aokigahara','R'],['柳橋','やなぎばし','Yanagibashi','L'],['山砥','やまと','Yamato','L']];
const AL=[['海河','うみかわ','Umikawa','R'],['山王','さんのう','Sanno','L'],['駒ヶ野','こまがの','Komagano','L'],['京町','けいまち','Keimachi','L'],['九良賀野','くらがの','Kuragano','L'],['柴谷','しばたに','Sibatani','R'],['神谷町','かみやちょう','Kamiyacho','L'],['青木ヶ原','あおきがはら','Aokigahara','L']];

const TBS=[];TBS[13]=['浅井','あさい','Asai','L'];TBS[14]=['片瀬片折','かたせかたおり','Katasekataori','L'];TBS[15]=['繩手','なわた','Nawata','L'];TBS[16]=['浜松井','はままつい','Hamamatui','L'];
const ARR={TN:NT,TY:NS,A:AL,TA:TAS,TO:TOS,TB:TBS};
const DC={TB:'TN'};
const LN={TN:{t:['奈留都線','なるとせん','Naruto Line'],c:'#0b62b5'},TY:{t:['山河線','やまかわせん','Yamakawa Line'],c:'#13944a'},A:{t:['青海線','あおみせん','Aomi Line'],c:'#17a398'},TA:{t:['荒川線','あらかわせん','Arakawa Line'],c:'#f0461e'},TO:{t:['雄町線','おまちせん','Omachi Line'],c:'#7f8f9a'},TB:{t:['奈留都支線','なるとしせん','Naruto Branch Line'],c:'#e8920f'}};
const TY={local:{t:['各駅停車','かくえきていしゃ','Local'],bg:'#8a8a8a'},futsu:{t:['普通','ふつう','Local'],bg:'#8a8a8a'},rapid:{t:['快速','かいそく','Rapid'],bg:'#f08300'},srapid:{t:['新快速','しんかいそく','Special Rapid'],bg:'#1d7fe0'},rexp:{t:['快速急行','かいそくきゅうこう','Rapid Express'],bg:'#12a0e8'},ltd:{t:['特急','とっきゅう','Limited Exp.'],bg:'#d7262c'}};
const TYE={local:'local train',futsu:'local train',rapid:'Rapid Service',srapid:'Special Rapid Service',rexp:'Rapid Express',ltd:'Limited Express'};
const XF={'TN:青木ヶ原':['TY','A'],'TN:上沢':['TY'],'TN:浅井':['TB'],'TY:青木ヶ原':['TN','A'],'TY:上沢':['TN'],'TY:荒川河口':['TA'],'A:青木ヶ原':['TN','TY'],'TA:荒川河口':['TY'],'TB:浅井':['TN']};
const SD={L:['左','left'],R:['右','right']};
let WX='【天気予報】 天気情報を取得しています…',WXL=0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WI={1:'<circle cx="12" cy="12" r="5" fill="#ffb300"/><g stroke="#ffb300" stroke-width="2" stroke-linecap="round"><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/></g>',
2:'<path d="M6.5 19h11a4.5 4.5 0 0 0 .6-9A6 6 0 0 0 6.6 11.2 4 4 0 0 0 6.5 19z" fill="#c9d1d9" stroke="#8b96a0" stroke-width="1.2"/>',
3:'<path d="M6.5 14h11a4 4 0 0 0 .5-8A5.5 5.5 0 0 0 7.1 7.4 3.4 3.4 0 0 0 6.5 14z" fill="#9aa6b2"/><g stroke="#4aa3ff" stroke-width="2" stroke-linecap="round"><path d="M8 16.5l-1.2 3.5M12.5 16.5l-1.2 3.5M17 16.5l-1.2 3.5"/></g>',
4:'<path d="M6.5 13h11a4 4 0 0 0 .5-8A5.5 5.5 0 0 0 7.1 6.4 3.4 3.4 0 0 0 6.5 13z" fill="#b8c4cf"/><g fill="#7fbfff" stroke="#3b8fe0" stroke-width=".8"><circle cx="8" cy="17.5" r="1.8"/><circle cx="12.5" cy="20" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></g>'};
function wIcon(code){const c=String(code||'').trim(),m=c[0],s=c[2],j=c[1];if(!WI[m])return'';const sv=(k,z)=>'<svg viewBox="0 0 24 24" style="width:'+z+'em;height:'+z+'em;vertical-align:-.15em">'+WI[k]+'</svg>';
return'<span style="display:inline-block;background:#fff;border-radius:.25em;padding:0 .1em;margin:0 .25em 0 .15em;line-height:1">'+sv(m,1.05)+(WI[s]&&s!==m?'<span style="color:#555;font-size:.6em;vertical-align:.1em">'+(j==='1'?'→':'|')+'</span>'+sv(s,.75):'')+'</span>'}
async function loadWX(){try{const r=await fetch('https://weathernews.jp/forecast/xml/all.xml',{cache:'no-store'});if(!r.ok)throw 0;const x=new DOMParser().parseFromString(await r.text(),'application/xml');
const seen=new Set(),out=[];let n=0;x.querySelectorAll('point').forEach(p=>{const nm=p.getAttribute('name');if(!nm||seen.has(nm))return;const mx=(p.querySelector('maxtemp')||{}).textContent,mn=(p.querySelector('mintemp')||{}).textContent,wc=((p.querySelector('weather')||{}).textContent||'').split(',')[0];if(!mx||!mn)return;const H=mx.split(',')[0].trim(),Lo=mn.split(',')[0].trim();if(H===''||Lo==='')return;seen.add(nm);out.push(esc(nm)+wIcon(wc)+esc(H)+'C/'+esc(Lo)+'C');n+=nm.length+8});
if(!out.length)throw 0;const dd=+(x.querySelector('datadate')||{}).textContent;let ts='';if(dd){const d=new Date(dd*1000);ts=(d.getMonth()+1)+'月'+d.getDate()+'日'+d.getHours()+'時'+String(d.getMinutes()).padStart(2,'0')+'分発表'}
WX='【天気予報（ウェザーニュース）'+(ts?' '+ts:'')+'】　'+out.join('　');WXL=n+30}catch(e){WX='【天気予報】 天気情報を取得できませんでした';WXL=0}lastTick='';try{render()}catch(e){}}
loadWX();setInterval(loadWX,30*60*1000);
const PS=['この電車には、優先席があります。優先席を必要とされるお客様がいらっしゃいましたら、席をお譲りください。お客様のご協力をお願いいたします。お客様にお願いいたします。優先席付近では、携帯電話の電源をお切りください。それ以外の場所では、マナーモードに設定のうえ、通話はお控えください。ご協力をお願いいたします。','There are priority seats in most cars. Please offer your seat to those who may need it. Please switch off your mobile phone when you are near the priority seats. In other areas, please set it to silent mode and refrain from talking on the phone.'];

SV.push({l:'青海線 快速急行 青木ヶ原行き（海河→青木ヶ原）',s:[1,2,5,6,8].map(n=>mk('A',n,'rexp'))});
SV.push({l:'青海線 快速急行 海河行き（青木ヶ原→海河）',s:[8,6,5,2,1].map(n=>mk('A',n,'rexp'))});
SV.push({l:'荒川線 各駅停車 富士見野行き',s:rg(1,7).map(n=>mk('TA',n,'local'))});
SV.push({l:'荒川線 各駅停車 荒川河口行き',s:rg(1,7).reverse().map(n=>mk('TA',n,'local'))});
