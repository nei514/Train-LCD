<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="車内LCD">
<meta name="theme-color" content="#000000">
<title>奈留都線・仙山線・青海線 車内LCD</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
:root{--bg:#fff;--fg:#1a1a1a;--sub:#5f5f5a;--card:#f3f3f1;--line:rgba(0,0,0,.12);--btn:#fff;--acc:#2b6fd6;--text-primary:var(--fg);--text-secondary:var(--sub);--border-accent:var(--acc);--sl:env(safe-area-inset-left);--sr:env(safe-area-inset-right);--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom)}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--fg:#eee;--sub:#aaa;--card:#1e1e1e;--line:rgba(255,255,255,.15);--btn:#2a2a2a;--acc:#6aa0ff}}
html{-webkit-text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;touch-action:manipulation;padding:var(--st) var(--sr) var(--sb) var(--sl)}
.app{max-width:960px;margin:0 auto;padding:12px;box-sizing:border-box}
.frame{background:#2a2c30;border-radius:12px;padding:8px;box-sizing:border-box}
@media (min-width:600px){.frame{padding:12px}}
.ctrl{background:var(--card);border-radius:12px;padding:12px;margin-top:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row+.row{margin-top:8px}
button,select{font:inherit;font-size:16px;min-height:44px;padding:0 14px;border:0.5px solid var(--line);border-radius:10px;background:var(--btn);color:var(--fg);cursor:pointer}
button{flex:1 1 auto}
button:active{transform:scale(.98)}
select{flex:1 1 100%;width:100%}
.lbl{font-size:13px;color:var(--sub);flex:1 1 100%}
#stat{font-size:13px;color:var(--sub)}
.ann{border-top:0.5px solid var(--line);margin-top:12px;padding-top:10px;font-size:15px;line-height:1.7}
textarea{width:100%;height:280px;margin-top:8px;font-family:ui-monospace,Menlo,monospace;font-size:16px;box-sizing:border-box;background:var(--btn);color:var(--fg);border:0.5px solid var(--line);border-radius:10px;padding:8px}
.scr{container-type:inline-size;aspect-ratio:16/9;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;font-family:"Hiragino Sans","Noto Sans JP",sans-serif;color:#111;-webkit-user-select:none;user-select:none}
.col{width:11cqw;flex-shrink:0;box-sizing:border-box}
.vt{writing-mode:vertical-rl;font-weight:500;line-height:1.05;letter-spacing:.1cqw}
.chv{position:absolute;top:0;width:1.8cqw;height:5cqw;background:#c8102e;clip-path:polygon(0 0,45% 0,100% 50%,45% 100%,0 100%,55% 50%)}
.arw{width:13cqw;height:9cqw;background:#1f3fd1;clip-path:polygon(0 30%,55% 30%,55% 0,100% 50%,55% 100%,55% 70%,0 70%);flex-shrink:0}
.dl{animation:dl 4s forwards}.dr{animation:dr 4s forwards}
@keyframes dl{0%,20%{transform:translateX(0)}60%,100%{transform:translateX(-94%)}}
@keyframes dr{0%,20%{transform:translateX(0)}60%,100%{transform:translateX(94%)}}
@keyframes tk{from{transform:translateX(100cqw)}to{transform:translateX(-100%)}}
@keyframes pl{50%{opacity:.25}}
@media (orientation:landscape) and (max-height:500px){
.app{max-width:none;display:flex;gap:12px;align-items:flex-start;padding:8px}
.frame{flex:0 0 auto;padding:6px;width:calc((100dvh - var(--st) - var(--sb) - 28px)*16/9 + 12px)}
.ctrl{flex:1;min-width:0;margin-top:0;max-height:calc(100dvh - var(--st) - var(--sb) - 16px);overflow:auto;-webkit-overflow-scrolling:touch}
}
body.only{background:#000}
body.only .ctrl{display:none}
body.only .app{max-width:none;padding:0;min-height:calc(100dvh - var(--st) - var(--sb));display:flex;align-items:center;justify-content:center}
body.only .frame{border-radius:0;padding:0;width:min(calc(100vw - var(--sl) - var(--sr)),calc((100dvh - var(--st) - var(--sb))*16/9))}
</style>
</head>
<body>
<main class="app">
<div class="frame" id="frame">
<div class="scr">
<div id="hd" style="height:6.5cqw;display:flex;align-items:center;gap:1.6cqw;padding:0 1.5cqw;flex-shrink:0;background:#f4f5f6"></div>
<div id="nx" style="height:12cqw;display:flex;align-items:center;flex-shrink:0"></div>
<div id="dv" style="height:.6cqw;flex-shrink:0"></div>
<div id="rb" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>
<div style="height:4cqw;background:#0d2a4f;color:#ffe066;overflow:hidden;flex-shrink:0;display:flex;align-items:center;font-size:2.1cqw;white-space:nowrap"><span id="tick" style="display:inline-block;padding-left:2cqw"></span></div>
<div id="mp" style="position:absolute;left:0;right:0;top:6.5cqw;bottom:4cqw;background:#fff;display:none"></div>
</div>
</div>
<section class="ctrl">
<div class="row"><select id="sv"></select></div>
<div class="row">
<button id="bk"><i class="ti ti-player-track-prev"></i> 戻る</button>
<button id="fw">進む <i class="ti ti-player-track-next"></i></button>
<button id="au"><i class="ti ti-player-play"></i> 自動</button>
</div>
<div class="row">
<button id="mpb"><i class="ti ti-map"></i> 路線図</button>
<button id="only"><i class="ti ti-device-tv"></i> LCDのみ表示</button>
</div>
<div class="row"><span class="lbl">表示器の位置</span><button id="sdL">進行方向左側のドア上</button><button id="sdR">進行方向右側のドア上</button></div>
<div class="row"><span id="stat"></span></div>
<div class="ann">
<div id="annH" style="font-size:13px;color:var(--sub)"></div>
<div id="annJ"></div>
<div id="annE" style="color:var(--sub)"></div>
<div id="annM" style="margin-top:6px"></div>
</div>
<div class="row" style="margin-top:8px"><button id="ex"><i class="ti ti-file-text"></i> 全系統の放送をテキストで表示</button><button id="cp" style="display:none"><i class="ti ti-copy"></i> コピー</button></div>
<textarea id="ta" readonly style="display:none"></textarea>
</section>
</main>
<script>
const NT=[['奈留都','なると','Naruto','L'],['武蔵小金井','むさしこがねい','Musashi-Koganei','L'],['山里','さんり','Sanri','L'],['青木ヶ原','あおきがはら','Aokigahara','L'],['上沢','かみざわ','Kamizawa','R'],['武蔵大和','むさしやまと','Musashi-Yamato','L'],['本只見','ほんただみ','Hontadami','L'],['尾野','おの','Ono','L'],['青海','あおみ','Aomi','R'],['上之','かみの','Kamino','R'],['蒼井','あおい','Aoi','L'],['東浅井','ひがしあさい','Higashi-Asai','L'],['上越市','かみえつし','Kamietsu-Shi','L'],['浅井','あさい','Asai','L']];
const NS=[['仙ヶ家','せんがや','Sengaya','L'],['荒川河口','あらかわかこう','Arakawa-Estuary','L'],['松ケ谷中央','まつがやちゅうおう','Matugaya-Chuo','R'],['相模湾','さがみわん','Sagami-bay','L'],['大納','おのう','Onou','L'],['上沢','かみざわ','Kamizawa','R'],['青木ヶ原','あおきがはら','Aokigahara','R'],['柳橋','やなぎばし','Yanagibashi','L'],['山砥','やまと','Yamato','L']];
const AL={1:['海河','うみかわ','Umikawa','R'],6:['柴谷','しばたに','Sibatani','R'],11:['青木ヶ原','あおきがはら','Aokigahara','L']};
const LN={NT:{t:['奈留都線','なるとせん','Naruto Line'],c:'#0b62b5'},NS:{t:['仙山線','せんざんせん','Senzan Line'],c:'#13944a'},A:{t:['青海線','あおみせん','Aomi Line'],c:'#17a398'}};
const TY={local:{t:['各駅停車','かくえきていしゃ','Local'],bg:'#8a8a8a'},rapid:{t:['快速','かいそく','Rapid'],bg:'#f08300'},srapid:{t:['新快速','しんかいそく','Special Rapid'],bg:'#1d7fe0'},ltd:{t:['特急','とっきゅう','Limited Exp.'],bg:'#d7262c'}};
const TYE={local:'local train',rapid:'Rapid Service',srapid:'Special Rapid Service',ltd:'Limited Express'};
const XF={'NT:青木ヶ原':['NS','A'],'NT:上沢':['NS'],'NS:青木ヶ原':['NT','A'],'NS:上沢':['NT'],'A:青木ヶ原':['NT','NS']};
const SD={L:['左','left'],R:['右','right']};
const JR='【JR東日本 運行情報　10月12日14時59分現在】　山手線：渋谷駅での人身事故の影響で、内回りで運転見合わせ（15時00分頃再開見込）　／　湘南新宿ライン：山手線内の人身事故の影響で運転見合わせ（15時00分頃再開見込）　／　相鉄線直通列車：新宿～羽沢横浜国大間で運転見合わせ（15時00分頃再開見込）　／　京浜東北線：上下線の一部列車に遅れ。大宮方面は快速運転を中止し各駅に停車　／　埼京線：新宿～大崎間で運転見合わせ（15時00分頃再開見込）　／　川越線：埼京線への直通運転を中止　／　総武本線：台風25号の影響で八街～成東間は終日運転見合わせ、バス代行輸送　／　内房線：台風25号の影響で姉ケ崎～長浦間は終日運転見合わせ、バス代行輸送　／　久留里線：台風25号の影響で久留里～上総亀山間は終日運転見合わせ　／　その他の路線は平常運転';
const PS=['この電車には、優先席があります。優先席を必要とされるお客様がいらっしゃいましたら、席をお譲りください。お客様のご協力をお願いいたします。お客様にお願いいたします。優先席付近では、携帯電話の電源をお切りください。それ以外の場所では、マナーモードに設定のうえ、通話はお控えください。ご協力をお願いいたします。','There are priority seats in most cars. Please offer your seat to those who may need it. Please switch off your mobile phone when you are near the priority seats. In other areas, please set it to silent mode and refrain from talking on the phone.'];
const SS=['お客様にお願いいたします。電車は事故防止のため、やむを得ず急停車することがありますので、お立ちのお客様は、つり革や手すりにおつかまりください。','It may be necessary for the train to stop suddenly to prevent an accident. So please be careful.'];
const rg=(a,b)=>{const r=[];for(let i=a;i<=b;i++)r.push(i);return r};
function mk(c,n,ty){const d=c==='NT'?NT[n-1]:c==='NS'?NS[n-1]:AL[n];return{t:[d[0],d[1],d[2]],door:d[3],code:c,num:n,line:c,type:ty}}
const PAT={local:rg(1,14),rapid:[1,4,5,7,9,10,13,14],srapid:[1,4,5,9,10,13,14],ltd:[1,4,10,13,14]};
const SV=[];
for(const ty of ['local','rapid','srapid','ltd']){SV.push({l:'奈留都線 '+TY[ty].t[0]+' 浅井行き',s:PAT[ty].map(n=>mk('NT',n,ty))});SV.push({l:'奈留都線 '+TY[ty].t[0]+' 奈留都行き',s:[...PAT[ty]].reverse().map(n=>mk('NT',n,ty))})}
SV.push({l:'仙山線 各駅停車 山砥行き',s:rg(1,9).map(n=>mk('NS',n,'local'))});
SV.push({l:'仙山線 各駅停車 仙ヶ家行き',s:rg(1,9).reverse().map(n=>mk('NS',n,'local'))});
SV.push({l:'青海線直通 浅井行き（海河→浅井）',s:[mk('A',1,'rapid'),mk('A',6,'rapid'),mk('A',11,'rapid'),...rg(5,14).map(n=>mk('NT',n,'local'))]});
SV.push({l:'青海線直通 海河行き（浅井→海河）',s:[...rg(4,14).reverse().map(n=>mk('NT',n,'local')),mk('A',6,'rapid'),mk('A',1,'rapid')]});
const cd=s=>s.code+' '+String(s.num).padStart(2,'0');
const an=w=>/^[AEIOU]/.test(w)?'an '+w:'a '+w;
const eor=a=>a.length<2?a.join(''):a.length===2?a[0]+' or '+a[1]:a.slice(0,-1).join(', ')+', or '+a[a.length-1];
const xfJ=s=>{const x=XF[s.code+':'+s.t[0]]||[];return x.length?x.map(c=>LN[c].t[0]).join('、')+'は、お乗り換えです。':''};
const xfE=s=>{const x=XF[s.code+':'+s.t[0]]||[];return x.length?' Please change here for '+x.map(c=>'the '+LN[c].t[2]).join(' and ')+'.':''};
const thx=ty=>ty==='ltd'?'traveling on':'using';
function between(a,b){if(a.code!==b.code||a.code==='A')return[];const arr=a.code==='NT'?NT:NS;const lo=Math.min(a.num,b.num),hi=Math.max(a.num,b.num);let r=[];for(let n=lo+1;n<hi;n++)r.push(arr[n-1]);if(a.num>b.num)r.reverse();return r}
function chg(S,b,i){const last=S.length-1,d=S[last];if(i+1<=last&&S[i+1].line!==b.line){const n=S[i+1];return['この電車は、'+b.t[0]+'から'+LN[n.line].t[0]+'に入り、'+TY[n.type].t[0]+'、'+d.t[0]+'行きとなります。',' From '+b.t[2]+', this train will become '+an(LN[n.line].t[2])+' '+TYE[n.type]+' bound for '+d.t[2]+'.']}return['','']}
function dep(S,i){const last=S.length-1,a=S[i],b=S[i+1],d=S[last],ty=b.type,ln=LN[b.line];let J='',E='';const nl=i>0&&b.line!==a.line;
if(i===0||nl){J+='今日も'+ln.t[0]+'をご利用くださいまして、ありがとうございます。';E+='Thank you for '+thx(ty)+' the '+ln.t[2]+'.';let th=null;for(let j=i+2;j<=last;j++)if(S[j].line!==b.line){th=S[j];break}
if(th){J+='この電車は、'+LN[th.line].t[0]+'直通、'+d.t[0]+'行きです。'+ln.t[0]+'内は'+TY[ty].t[0]+'、'+LN[th.line].t[0]+'内は'+TY[th.type].t[0]+'となります。';E+=' This is the '+TYE[ty]+' bound for '+d.t[2]+', going through to the '+LN[th.line].t[2]+'. This train will run as '+an(TYE[th.type])+' on the '+LN[th.line].t[2]+'.'}
else{J+='この電車は、'+TY[ty].t[0]+'、'+d.t[0]+'行きです。';E+=' This is the '+TYE[ty]+' bound for '+d.t[2]+'.';if(ty!=='local'&&i===0){const st=S.slice(1);J+='停車駅は、'+st.map((s,k)=>k===st.length-1?'終点、'+s.t[0]:s.t[0]).join('、')+'です。';E+=' We will be stopping at '+st.slice(0,-1).map(s=>s.t[2]).join(', ')+', and '+d.t[2]+', the terminal.'}}}
const sk=between(a,b);if(sk.length){if(!(i===0||nl))J+=TY[ty].t[0]+'、'+d.t[0]+'行きです。';J+=sk.map(x=>x[0]).join('、')+'には止まりません。';E+=' This train will not stop at '+eor(sk.map(x=>x[2]))+'.'}
const tm=i+1===last;J+='次は、'+(tm?'終点、':'')+b.t[0]+'、'+b.t[0]+'。お出口は、'+SD[b.door][0]+'側です。'+xfJ(b);E+=' The next station is '+b.t[2]+', '+cd(b)+(tm?', the terminal':'')+'. The doors on the '+SD[b.door][1]+' side will open.'+xfE(b);
const c=chg(S,b,i+1);J+=c[0];E+=c[1];
if(tm){J+='お忘れ物のないよう、ご注意ください。今日も'+ln.t[0]+'をご利用くださいまして、ありがとうございました。';E+=' Please make sure you have all your belongings with you. Thank you for '+thx(ty)+' the '+ln.t[2]+'.'}
return[J,E.trim()]}
function soonA(S,i){const last=S.length-1,b=S[i],tm=i===last;let J='まもなく、'+(tm?'終点、':'')+b.t[0]+'、'+b.t[0]+'。お出口は、'+SD[b.door][0]+'側です。'+xfJ(b);let E='We will soon be arriving at '+b.t[2]+', '+cd(b)+(tm?', the terminal':'')+'. The doors on the '+SD[b.door][1]+' side will open.'+xfE(b);const c=chg(S,b,i);J+=c[0];E+=c[1];if(tm){J+='お忘れ物のないよう、ご注意ください。';E+=' Please make sure you have all your belongings with you.'}return[J,E]}
function manners(S){const n=S.length-1,m={},a=Math.max(1,Math.floor(n/3)),b=Math.floor(2*n/3);if(a<n-1)m[a]=PS;if(b<n-1&&b!==a)m[b]=SS;return m}
let sv=0,t=0,ph='stop',L=0,side='L',mode='main',tmA=null,tmS=[],lastTick='',doorBuilt=false,wl=null;
const $=id=>document.getElementById(id);
SV.forEach((v,i)=>{const o=document.createElement('option');o.value=i;o.textContent=v.l;$('sv').appendChild(o)});
function fit(el,mx,mn){let f=mx;el.style.fontSize=f+'cqw';while(el.scrollWidth>el.clientWidth+1&&f>mn){f-=.25;el.style.fontSize=f+'cqw'}}
const NTX=i=>120+(i-1)*104;
const NSP={1:[564,705],2:[564,640],3:[564,570],4:[564,500],5:[564,430],6:[564,352],7:[404,352],8:[404,175],9:[404,60]};
const AP={1:[90,470],6:[250,470],11:[404,352]};
const pos=s=>s.code==='NT'?(s.num===4?[418,341]:s.num===5?[550,341]:[NTX(s.num),330]):s.code==='NS'?(s.num===6?[550,341]:s.num===7?[418,341]:NSP[s.num]):(s.num===11?[418,341]:AP[s.num]);
function lbl(txt,x,y,up){if(L===2)return'<text transform="translate('+x+','+y+') rotate(-55)" font-size="22" fill="#111">'+txt+'</text>';const ch=[...txt];return ch.map((c,i)=>'<text x="'+x+'" y="'+(up?y-(ch.length-1-i)*29:y+i*29)+'" font-size="27" text-anchor="middle" fill="#111">'+c+'</text>').join('')}
function mapSVG(S){let g='<svg viewBox="0 0 1600 730" style="width:100%;height:100%;display:block">';
g+='<text x="40" y="70" font-size="42" fill="#111">'+['路線図','ろせんず','Route map'][L]+'</text>';
g+='<line x1="'+NTX(1)+'" y1="330" x2="'+NTX(14)+'" y2="330" stroke="'+LN.NT.c+'" stroke-width="14"/>';
g+='<path d="M404 60V352H564V705" stroke="'+LN.NS.c+'" stroke-width="14" fill="none"/>';
g+='<path d="M404 352L330 470H90" stroke="'+LN.A.c+'" stroke-width="14" fill="none"/>';
[[432,330,404,352],[536,330,564,352]].forEach(q=>{g+='<line x1="'+q[0]+'" y1="'+q[1]+'" x2="'+q[2]+'" y2="'+q[3]+'" stroke="#111" stroke-width="34" stroke-linecap="round"/><line x1="'+q[0]+'" y1="'+q[1]+'" x2="'+q[2]+'" y2="'+q[3]+'" stroke="#fff" stroke-width="22" stroke-linecap="round"/>'});
const dot=(x,y)=>'<circle cx="'+x+'" cy="'+y+'" r="11" fill="#fff" stroke="#111" stroke-width="5"/>';
NT.forEach((d,i)=>{const x=NTX(i+1);if(i!==3&&i!==4)g+=dot(x,330);g+=lbl(d[L],x,300,true)});
[1,2,3,4,5,8,9].forEach(n=>{const p=NSP[n];g+=dot(p[0],p[1]);g+='<text x="'+(n>7?p[0]-26:p[0]+26)+'" y="'+(p[1]+9)+'" font-size="'+(L===2?22:27)+'" text-anchor="'+(n>7?'end':'start')+'" fill="#111">'+NS[n-1][L]+'</text>'});
[1,6].forEach(n=>{const p=AP[n];g+=dot(p[0],p[1]);g+='<text x="'+p[0]+'" y="'+(p[1]+46)+'" font-size="'+(L===2?22:27)+'" text-anchor="middle" fill="#111">'+AL[n][L]+'</text>'});
[['NT',1180,560],['NS',1180,610],['A',1180,660]].forEach(q=>{g+='<rect x="'+q[1]+'" y="'+(q[2]-10)+'" width="60" height="14" fill="'+LN[q[0]].c+'"/><text x="'+(q[1]+75)+'" y="'+(q[2]+4)+'" font-size="26" fill="#111">'+LN[q[0]].t[L]+'</text>'});
let p=pos(S[t]);if(ph!=='stop'&&t>0){const a=pos(S[t-1]);p=[(a[0]+p[0])/2,(a[1]+p[1])/2]}
g+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="26" fill="none" stroke="#e8382f" stroke-width="8" style="animation:pl 1s steps(1) infinite"/><text x="'+p[0]+'" y="'+(p[1]+62)+'" font-size="24" text-anchor="middle" fill="#e8382f">'+['現在地','げんざいち','Now'][L]+'</text>';

function doorHTML(tg){const open=tg.door===side;
